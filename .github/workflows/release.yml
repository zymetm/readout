name: Release

# A release is a bare version tag (1.0.0, never v1.0.0: the Obsidian
# community directory reads the tag as the version). A plain push to main
# never cuts a release; it only ever lands code.
#
# manifest.json stays the source of truth for the version. The guard job
# refuses a tag that does not equal manifest.json's version, and a tag that
# is not on main. Then the tests run, and only then is the release created.
#
# The release carries exactly three files: main.js, manifest.json and
# styles.css. Each one gets a signed GitHub artifact attestation (build
# provenance), so anyone can check that a downloaded file was built from
# this repository's tag by this workflow (gh attestation verify <file> --repo
# <owner>/<repo>). That is all the directory installer downloads. The SQLite
# engine is already inside main.js, so there is nothing else to ship. The
# release notes are the matching section of CHANGELOG.md.
#
# Rehearsal: run this workflow by hand (Actions, Release, Run workflow) with
# an EXISTING tag. A manual run is always a dry run: it checks the guard and
# runs the tests, and publishes
# nothing.
#
# This is ReadOut's own workflow. It calls no shared workflow from any other
# organisation, and every action is pinned to a commit SHA.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to rehearse. Nothing is published.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: The tag is the manifest version, and it sits on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: The tag is a bare version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not X.Y.Z"; exit 1; }

      - name: Check out the tagged commit (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: The tag matches manifest.json, versions.json and the changelog, and sits on main
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA" ] \
            || { echo "::error::checkout $SHA is not tag $TAG"; exit 1; }
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "::error::tag $TAG does not equal manifest.json version $MANIFEST"
            exit 1
          fi
          node -e "const v=require('./versions.json'); const m=require('./manifest.json'); if (v[m.version] !== m.minAppVersion) { console.error('versions.json does not map ' + m.version + ' to ' + m.minAppVersion); process.exit(1); }"
          grep -q "^## \[$TAG\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for $TAG"; exit 1; }
          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::tag $TAG points at $SHA, which is not on main"
            exit 1
          fi
          echo "tag $TAG == manifest.json $MANIFEST at $SHA, on main"

  test:
    name: The tests pass on the tagged commit
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The repo has no dependencies; package-lock.json pins that, and `npm ci`
      # fails if the lockfile and package.json ever disagree.
      - name: Check the lockfile
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

  release:
    name: Publish the release
    needs: test
    # A rehearsal never publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # The attestation is signed with this run's identity token and stored
      # with the repository.
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Attest the three release files (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Write the release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::the changelog section for $TAG is empty"; exit 1; }

      - name: Create the release with exactly three files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag

  verify:
    name: The published files are the tagged files
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Download the release and compare every file with the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published
          [ "$(ls published | sort | tr '\n' ' ')" = "main.js manifest.json styles.css " ] \
            || { echo "::error::the release must carry exactly main.js, manifest.json and styles.css"; ls published; exit 1; }
          for f in main.js manifest.json styles.css; do
            cmp "$f" "published/$f" || { echo "::error::$f in the release differs from the tag"; exit 1; }
          done
          sha256sum published/main.js published/manifest.json published/styles.css
          for f in main.js manifest.json styles.css; do
            gh attestation verify "published/$f" --repo "$GITHUB_REPOSITORY"
          done
