name: CI

# The pull request gate. It runs on every pull request and on every push to
# main, and branch protection on main requires this `ci` check, so a red run
# blocks the merge and a green one is the signal the reviewer reads.
#
# Merging ships nothing. A release is a bare version tag pushed by the
# maintainer (see release.yml where present); this workflow never tags,
# never publishes and never writes to the repository.
#
# Every action is pinned to a commit SHA (suite policy).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        # Node 22, not the shared release workflow's Node 20 default: the
        # test script hands `node --test` a quoted glob, and the test runner
        # only expands its own globs from Node 21. Node 20 reports "Could
        # not find test/*.test.cjs" and fails the run (seen 2026-09-21).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The repo has no dependencies; package-lock.json pins that, and `npm ci`
      # fails if the lockfile and package.json ever disagree.
      - name: Check the lockfile
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      # `npm run build` assembles main.js (src/main.js plus the patched vendored
      # sql.js and the wasm) and styles.css (from src/styles.css). Obsidian
      # installs the committed copies, so the build must give back exactly
      # those bytes: the step after it fails the run if the build changed them.
      - name: Build
        run: npm run build

      - name: Committed release files are exactly what the build makes
        run: git diff --exit-code -- main.js manifest.json styles.css
